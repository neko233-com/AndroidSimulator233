name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails@latest

      - name: Build
        run: wails build

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: bin/

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails@latest

      - name: Build
        run: wails build

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: bin/

  publish-release:
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows/

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos/

      - name: Zip Windows Build
        run: cd artifacts/windows && zip -r ../../AndroidSimulator233-Windows.zip .

      - name: Zip macOS Build
        run: cd artifacts/macos && zip -r ../../AndroidSimulator233-macOS.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AndroidSimulator233-Windows.zip
            AndroidSimulator233-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
