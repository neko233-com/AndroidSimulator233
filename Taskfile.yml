version: '3'

vars:
  APP_NAME: "AndroidSimulator233"
  BIN_DIR: "bin"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: frontend:build
      - cmd: go build -ldflags="-H windowsgui" -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .
        platforms: [windows]
      - cmd: go build -o {{.BIN_DIR}}/{{.APP_NAME}} .
        platforms: [linux, darwin]

  frontend:build:
    summary: Builds the frontend
    dir: frontend
    cmds:
      - npm run build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: build
      - cmd: ISCC.exe build/installer.iss
        platforms: [windows]

  run:
    summary: Runs the application
    cmds:
      - task: build
      - "{{.BIN_DIR}}/{{.APP_NAME}}.exe"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml
